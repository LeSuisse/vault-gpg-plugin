name: "CodeQL"

permissions:
  contents: read
  security-events: write
  actions: read
  deployments: none
  packages: none

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyse:
    name: Analyse
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        with:
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@b96794f015dfd88f77b49b1c93e0fa7110f94c63

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63
